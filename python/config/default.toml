# All tunable values. Times are in ms.

[capture]
camera = 1    # 1 for laptops with IR camera at index 0 (e.g. Acer Aspire 7)
width = 1280
height = 720
fps = 30
mirror = true

[recognizer]
type = "mediapipe"          # mediapipe | replay
num_hands = 2
det_conf = 0.5
presence_conf = 0.5
track_conf = 0.5

[decision]
# Tuned with recorded videos & gesture dataset
min_shape_score = 0.60
window_ms = 120
punch_window_ms = 150
cooldown_ms = 250
block_hold_ms = 120
blur_grace_ms = 60
lost_grace_ms = 300
punch_size_growth = 0.15     # relative hand-size increase within window
punch_min_vel_scale = 1.30
palm_min_scale_gain = 0.12
palm_min_vel_scale = 0.90
palm_min_r_open = 1.48
fist_max_r_open = 1.28
block_max_planar_vel = 0.85
block_max_scale_vel = 0.65

[transport]
host = "127.0.0.1"
port = 5005
